[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tram-forecast"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "duckdb>=1.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8"]
docs = ["reportlab>=4", "matplotlib>=3.8", "svglib>=1.5", "pypdf>=5"]

[project.scripts]
tram-forecast = "tram_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.black]
target-version = ["py310"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

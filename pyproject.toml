[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tram-forecast"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "duckdb>=1.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tram-forecast = "tram_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
